# Slack App Manifest for the Daily Work Report reminder bot.
# Create the app at https://api.slack.com/apps → "From an app manifest",
# paste this, then install to your workspace and copy the Bot Token (xoxb-)
# and Signing Secret into server/.env.
display_information:
  name: Daily Report Bot
  description: Sends daily work-report reminders and PM submission notifications.
  background_color: "#6366f1"
features:
  bot_user:
    display_name: dailyreport
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write        # post reminders + submission notifications
      - chat:write.public # post to channels the bot isn't a member of
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
